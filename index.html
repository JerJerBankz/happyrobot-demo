<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HappyRobot Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0A0A0A;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .card {
    background: #0A0A0A;
    padding: 32px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 360px;
  }
  #qrcode {
    background: white;
    padding: 16px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .headline {
    color: white;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.3px;
  }
  .sub {
    color: #777;
    font-size: 14px;
    text-align: center;
    line-height: 1.5;
  }
  .number {
    color: #444;
    font-size: 13px;
    font-family: monospace;
    letter-spacing: 0.5px;
  }
  .logo {
    color: #FF4800;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .call-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: #FF4800;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    letter-spacing: 0.3px;
  }
  .call-btn:hover { background: #e03f00; }
  @media (min-width: 600px) {
    .call-btn { display: none; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">HappyRobot</div>
  <div id="qrcode"></div>
  <div class="headline">Talk to our AI — live.</div>
  <div class="sub">Scan to call the HappyRobot demo line.<br>No app needed — just your phone.</div>
  <div class="number">+1 (763) 265-6438</div>
  <a class="call-btn" href="tel:+17632656438">Tap to Call</a>
</div>

<script>
  new QRCode(document.getElementById("qrcode"), {
    text: "+17632656438",
    width: 260,
    height: 260,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
</script>
</body>
</html>
