<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HappyRobot Demo — Supply Chain USA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0A0A0A;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 24px 0;
  }
  .card {
    background: #0A0A0A;
    padding: 32px 28px;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    width: 100%;
    max-width: 420px;
  }
  .logo img { height: 32px; width: auto; }

  .event-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #161616;
    border: 1px solid #222;
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 13px;
    color: #666;
    letter-spacing: 0.3px;
  }
  .event-badge .dot {
    width: 6px; height: 6px;
    background: #FF4800;
    border-radius: 50%;
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  #qrcode {
    background: white;
    padding: 16px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .counter {
    font-size: 14px;
    color: #555;
    letter-spacing: 0.3px;
  }
  .counter span { color: #FF4800; font-weight: 600; }

  .headline {
    color: white;
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.5px;
  }

  .expect {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .expect-item {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    color: #666;
  }
  .expect-item .icon {
    font-size: 17px;
    flex-shrink: 0;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: #1a1a1a;
  }

  .jeremy {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
  }
  .jeremy-avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: #1a1a1a;
    border: 1px solid #222;
    flex-shrink: 0;
    overflow: hidden;
  }
  .jeremy-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .jeremy-info { flex: 1; }
  .jeremy-name { color: white; font-size: 16px; font-weight: 600; }
  .jeremy-title { color: #555; font-size: 13px; margin-top: 3px; }
  .jeremy-link {
    font-size: 13px;
    color: #FF4800;
    text-decoration: none;
    border: 1px solid #2a1500;
    border-radius: 5px;
    padding: 6px 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .jeremy-link:hover { background: #1a0b00; }

  .number {
    color: #444;
    font-size: 14px;
    font-family: monospace;
    letter-spacing: 0.5px;
  }

  .call-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: #FF4800;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  .call-btn:hover { background: #e03f00; }
  @media (min-width: 600px) { .call-btn { display: none; } }
</style>
</head>
<body>
<div class="card">

  <div class="logo">
    <img src="https://cdn.prod.website-files.com/686ce151be97e21fe2785a8e/69fb2e8e82718ab7d4befbc7_happyrobot%20-%20full%20logo%20-%20white.svg" alt="HappyRobot">
  </div>

  <div class="event-badge">
    <div class="dot"></div>
    Live at Supply Chain USA &nbsp;·&nbsp; Chicago, June 23–24
  </div>

  <div id="qrcode"></div>

  <a class="call-btn" href="tel:+17632656438">Tap to Call</a>

  <div class="counter"><span id="callCount">0</span> calls from this demo</div>

  <div class="headline">Talk to our AI — live.</div>

  <div class="expect">
    <div class="expect-item"><span class="icon">⚡</span> AI answers instantly — no wait, no hold music</div>
    <div class="expect-item"><span class="icon">🕐</span> ~2 minute call — quick and to the point</div>
    <div class="expect-item"><span class="icon">📬</span> HappyRobot follows up with next steps</div>
  </div>

  <div class="divider"></div>

  <div class="jeremy">
    <div class="jeremy-avatar"><img src="/headshot.jpg" alt="Jeremy Cmiel"></div>
    <div class="jeremy-info">
      <div class="jeremy-name">Jeremy Cmiel</div>
      <div class="jeremy-title">Account Executive · HappyRobot</div>
    </div>
    <a class="jeremy-link" href="https://www.linkedin.com/in/jeremy-cmiel-b2165590/" target="_blank">LinkedIn →</a>
  </div>

</div>

<script>
  new QRCode(document.getElementById("qrcode"), {
    text: "+17632656438",
    width: 240,
    height: 240,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });

  // Real call counter — fetched from server, refreshes every 30s
  function refreshCount() {
    fetch('/count')
      .then(r => r.json())
      .then(d => { document.getElementById('callCount').textContent = d.count; })
      .catch(() => {});
  }
  refreshCount();
  setInterval(refreshCount, 30000);
</script>
</body>
</html>
